<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada | MotoYa Suzuki</title>
<link rel="icon" type="image/png" href="IMG/MOTOYAA.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
.error-page {
    min-height: 100vh;
    background: linear-gradient(135deg, #080C12 0%, #111827 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
}

.error-page::before {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(0,61,165,0.15), transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.error-code {
    font-family: var(--font-title);
    font-size: clamp(100px, 20vw, 180px);
    font-weight: 800;
    color: transparent;
    -webkit-text-stroke: 2px rgba(0,61,165,0.4);
    line-height: 1;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
}

.error-logo {
    width: 120px;
    margin: 0 auto 30px;
    position: relative;
    z-index: 1;
}

.error-title {
    font-family: var(--font-title);
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 700;
    color: var(--white);
    margin-bottom: 15px;
    position: relative;
    z-index: 1;
}

.error-text {
    color: #9CA3AF;
    font-size: 1rem;
    max-width: 450px;
    line-height: 1.7;
    margin-bottom: 40px;
    position: relative;
    z-index: 1;
}

.error-actions {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
    position: relative;
    z-index: 1;
}

.error-moto {
    width: min(300px, 80vw);
    margin: 40px auto 0;
    opacity: 0.15;
    position: relative;
    z-index: 1;
}

@media (max-width: 480px) {
    .error-actions {
        flex-direction: column;
        align-items: center;
    }
}
</style>
</head>
<body>

<div class="error-page">

    <img src="IMG/MOTOYAA.png" class="error-logo" alt="MotoYa">

    <div class="error-code">404</div>

    <h1 class="error-title">Página no encontrada</h1>

    <p class="error-text">
        La página que buscas no existe o fue movida. 
        Pero no te preocupes, tenemos muchas motos esperándote.
    </p>

    <div class="error-actions">
        <a href="motoya.html" class="btn-primary">
            <i class="fa-solid fa-house"></i> Volver al inicio
        </a>
        <a href="AGENDA.html" class="btn-outline" style="border-color: var(--primary); color: var(--primary-light);">
            <i class="fa-solid fa-calendar"></i> Agendar cita
        </a>
    </div>

    <img src="IMG/VSTROM250.jpeg" class="error-moto" alt="Suzuki">

</div>

<a href="https://wa.me/573016872703" class="whatsapp-float" target="_blank">
    <i class="fab fa-whatsapp"></i>
</a>

</body>
</html>
